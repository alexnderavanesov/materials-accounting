services:
  postgres:
    image: postgres:18
    container_name: materials-postgres
    environment:
      POSTGRES_USER: materials
      POSTGRES_PASSWORD: materials
      POSTGRES_DB: materials
    ports:
      - '55432:5432'
    volumes:
      - materials_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U materials -d materials']
      interval: 5s
      timeout: 5s
      retries: 12

  postgres-test:
    image: postgres:18
    container_name: materials-postgres-test
    environment:
      POSTGRES_USER: materials
      POSTGRES_PASSWORD: materials
      POSTGRES_DB: materials_test
    ports:
      - '5433:5432'
    volumes:
      - materials_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U materials -d materials_test']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  materials_postgres_data:
  materials_postgres_test_data:
