<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сброс данных материалов</title>
    <style>
      :root {
        color: #292524;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      body {
        align-items: center;
        background: #fafaf9;
        display: grid;
        min-height: 100vh;
        margin: 0;
      }

      main {
        background: #ffffff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        box-shadow: 0 14px 40px rgb(41 37 36 / 0.08);
        margin: 24px;
        max-width: 520px;
        padding: 28px;
      }

      h1 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 10px;
      }

      p {
        color: #57534e;
        line-height: 1.6;
        margin: 0 0 20px;
      }

      a {
        align-items: center;
        background: #44403c;
        border-radius: 8px;
        color: #ffffff;
        display: inline-flex;
        font-size: 14px;
        font-weight: 600;
        min-height: 40px;
        padding: 0 16px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Данные проектной базы очищены</h1>
      <p>
        Удалены временные данные приложения из localStorage для текущего адреса.
        Сейчас можно начинать тестирование с пустой базы.
      </p>
      <a href="/">Вернуться в приложение</a>
    </main>
    <script>
      localStorage.setItem(
        'materials.projectWorkspace.v1',
        JSON.stringify({
          configuredAlloys: [],
          configuredCiphers: [],
          configuredDocuments: [],
          configuredUnits: [],
          lines: [],
          materialIssues: [],
          materialReceipts: [],
          materialRequests: [],
          qualityControls: [],
        }),
      )
      sessionStorage.removeItem('tsr-scroll-restoration-v1_3')
    </script>
  </body>
</html>
